name: CI/CD - Build, Test & Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 mypy isort

      - name: Run Black formatter check
        run: black --check src/ tests/

      - name: Run isort import check
        run: isort --check-only src/ tests/

      - name: Run Flake8 linting
        run: flake8 src/ tests/ --max-line-length=120 --statistics

      - name: Run Mypy type checking
        run: mypy src/ --ignore-missing-imports

  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short || true

      - name: Generate coverage report
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Archive coverage reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        run: |
          echo "## 📊 Coverage Report" > /tmp/coverage.txt
          grep -A 5 "Name" htmlcov/status.json >> /tmp/coverage.txt || echo "See coverage report artifacts"
          echo "" >> /tmp/coverage.txt
          echo "📈 Full report available in artifacts" >> /tmp/coverage.txt

  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install build wheel

      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify build artifacts
        run: |
          ls -lh dist/
          echo "✅ Build successful!"

      - name: Archive build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: python-package
          path: dist/

  pre-commit-check:
    name: Pre-commit Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 mypy isort pytest pytest-cov

      - name: Run pre-commit checks
        run: |
          python .github/skills/pre-commit-reviewer/scripts/pre-commit-check.py all

  summary:
    name: CI/CD Summary
    runs-on: ubuntu-latest
    needs: [lint, test, build, pre-commit-check]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          echo "## ✅ CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Format | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests & Coverage | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Verify | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-commit Check | ${{ needs.pre-commit-check.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
