[pytest]
# Pytest configuration for Vehicle Telemetry Visualization MVP

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output & Reporting
addopts = 
    --verbose
    --strict-markers
    --tb=short
    -v
    --capture=no

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for end-to-end workflows
    slow: Slow tests (skipped by default)
    parametrize: Parameterized tests

# Minimum version
minversion = 7.0

# Coverage settings (when using pytest-cov)
[coverage:run]
source = src
omit = 
    */tests/*
    */conftest.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Line coverage targets
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
